services:
  db:
    image: postgres:18
    container_name: buildtrack-db
    environment:
      POSTGRES_DB: buildtrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: buildtrackpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build: .
    container_name: buildtrack-app
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/buildtrack
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: buildtrackpassword
      JWT_SECRET: ${JWT_SECRET}
      DEMO_DATA: "true"
      SHOW_SQL: "false"

    ports:
      - "8081:8080"

volumes:
  postgres_data:
  