spring.application.name=buildtrack
spring.config.import=optional:file:./local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/buildtrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8080}
# Behind a hosting proxy, use its https URL (keeps Swagger "Try it out" working)
server.forward-headers-strategy=framework

# Schema is managed by Flyway (src/main/resources/db/migration).
# Hibernate only checks that the entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}

# Sample data and a read-only demo login (off by default)
app.demo.enabled=${DEMO_DATA:false}
app.demo.username=${DEMO_USERNAME:demo}
app.demo.password=${DEMO_PASSWORD:DemoPass123!}