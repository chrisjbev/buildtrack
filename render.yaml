# Render Blueprint: deploys BuildTrack from the Dockerfile.
# The database is external (for example a free Neon PostgreSQL database);
# enter its connection details when Render asks for the values marked sync: false.
services:
  - type: web
    name: buildtrack
    runtime: docker
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_URL          # jdbc:postgresql://<host>/<database>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_DATA
        value: "true"
      - key: SHOW_SQL
        value: "false"
